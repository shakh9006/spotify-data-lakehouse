services:
  trino-coordinator:
    image: trinodb/trino:latest
    container_name: trino-coordinator
    ports:
      - 8080:8080
    volumes:
      - ./config/coordinator/config.properties:/etc/trino/config.properties
      - ./config/catalog:/etc/trino/catalog
    networks:
      - spotify-analytics

  trino-worker-1:
    image: trinodb/trino:latest
    container_name: trino-worker-1
    ports:
      - 8081:8080
    volumes:
      - ./config/worker/config.properties:/etc/trino/config.properties
      - ./config/catalog:/etc/trino/catalog
    depends_on:
      - trino-coordinator
    networks:
      - spotify-analytics

  trino-worker-2:
    image: trinodb/trino:latest
    container_name: trino-worker-2
    ports:
      - 8082:8080
    volumes:
      - ./config/worker/config.properties:/etc/trino/config.properties
      - ./config/catalog:/etc/trino/catalog
    depends_on:
      - trino-coordinator
    networks:
      - spotify-analytics

networks:
  spotify-analytics:
    external: true
    name: spotify-analytics
