services:
  nessie:
    image: projectnessie/nessie:latest
    container_name: nessie
    ports:
      - 19120:19120
    networks:
      - spotify-analytics

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - 9000:9000
      - 9001:9001
    env_file:
      - .env
    volumes:
      - minio-data:/data
    command: ['server', '/data', '--console-address', ':9001']
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 20s
      retries: 3
    depends_on:
      - nessie
    networks:
      - spotify-analytics

  minio-client:
    image: minio/mc
    container_name: mc
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set minio http://minio:9000 minioadmin minioadmin) do echo '...waiting...' && sleep 1; done;
      /usr/bin/mc mb --ignore-existing minio/spotify-warehouse;
      /usr/bin/mc anonymous set download minio/spotify-warehouse;
      tail -f /dev/null
      "
    networks:
      - spotify-analytics

volumes:
  minio-data:

networks:
  spotify-analytics:
    external: true
    name: spotify-analytics
